databaseChangeLog:
  - changeSet:
      id: create-comment-table-v1-0
      author: "Евгений С"
      changes:
        - createTable:
            schemaName: forum
            tableName: comment
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: message_info_id
                  type: UUID
                  constraints:
                    nullable: false
                    unique: true
              - column:
                 name: content
                 type: TEXT
              - column:
                  name: topic_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: parent_comment_id
                  type: UUID
                  constraints:
                    nullable: true

  - changeSet:
      id: add-fk-comment-message-info-v1-0
      author: "Евгений С"
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            baseColumnNames: message_info_id
            referencedTableSchemaName: forum
            referencedTableName: message_info
            referencedColumnNames: id
            constraintName: fk_comment_message_info
            onDelete: RESTRICT
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            constraintName: fk_comment_message_info

  - changeSet:
      id: add-fk-comment-topic-v1-0
      author: "Евгений С"
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            baseColumnNames: topic_id
            referencedTableSchemaName: forum
            referencedTableName: topic
            referencedColumnNames: id
            constraintName: fk_comment_topic
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            constraintName: fk_comment_topic

  - changeSet:
      id: add-fk-comment-parent-v1-0
      author: "Евгений С"
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            baseColumnNames: parent_comment_id
            referencedTableSchemaName: forum
            referencedTableName: comment
            referencedColumnNames: id
            constraintName: fk_comment_parent
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: comment
            constraintName: fk_comment_parent