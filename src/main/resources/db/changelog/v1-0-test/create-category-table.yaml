databaseChangeLog:
  - changeSet:
      id: create-category-table-v1-0
      author: "Евгений С"
      changes:
        - createTable:
            schemaName: forum
            tableName: category
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    nullable: false
                    primaryKey: true
              - column:
                  name: title
                  type: VARCHAR(50)
                  constraints:
                    nullable: false