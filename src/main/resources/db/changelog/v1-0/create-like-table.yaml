databaseChangeLog:
  - changeSet:
      id: create-like-table-v1-0
      author: "Евгений С"
      changes:
        - createTable:
            schemaName: forum
            tableName: like
            columns:
              - column:
                  name: user_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: message_id
                  type: UUID
                  constraints:
                    nullable: false
              - column:
                  name: like_value
                  type: INT
                  constraints:
                    nullable: false
  - changeSet:
      id: add-pk-to-like-v1-0
      author: "Евгений С"
      changes:
        - addPrimaryKey:
            schemaName: forum
            tableName: like
            columnNames: user_id, message_id
            constraintName: pk_like