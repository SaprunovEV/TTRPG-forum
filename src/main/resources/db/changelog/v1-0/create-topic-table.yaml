databaseChangeLog:
  - changeSet:
      id: create-topic-table-v1-0
      author: "Евгений С"
      changes:
        - createTable:
            schemaName: forum
            tableName: topic
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: message_info_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: business_id
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: category_id
                  type: BIGINT
                  constraints:
                    nullable: true
              - column:
                  name: title
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: content
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: VARCHAR(50)
                  defaultValue: "ACTIVE"
                  constraints:
                    nullable: false

  - changeSet:
      id: add-fk-topic-message-info-v1-0
      author: "Евгений С"
      changes:
        - addForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: topic
            baseColumnNames: message_info_id
            referencedTableSchemaName: forum
            referencedTableName: message_info
            referencedColumnNames: id
            constraintName: fk_topic_message_info
            onDelete: CASCADE
      rollback:
        - dropForeignKeyConstraint:
            baseTableSchemaName: forum
            baseTableName: topic
            constraintName: fk_topic_message_info